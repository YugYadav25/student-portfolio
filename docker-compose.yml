services:
  backend:
    build:
      context: ./task-manager-api
    env_file:
      - ./.env
    environment:
      PORT: 5000
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: .
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped
